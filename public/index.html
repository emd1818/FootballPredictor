<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Predictor V2.7</title>
<style>
:root{--bg:#08111f;--panel:#0e1a2b;--panel2:#122238;--line:#21334d;--text:#edf4ff;--muted:#8fa4bf;--accent:#54d6a2;--warn:#ffc857;--danger:#ff6b7a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#122c45 0,#08111f 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:24px 30px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:rgba(8,17,31,.9);position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
.logo{font-size:20px;font-weight:800;letter-spacing:.2px}.logo span{color:var(--accent)}.status{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}.dot.ok{background:var(--accent)}
main{max-width:1280px;margin:0 auto;padding:28px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);font-weight:700}.hero h1{font-size:34px;margin:7px 0}.hero p{color:var(--muted);margin:0;max-width:720px}.actions{display:flex;gap:9px}.btn{background:var(--accent);color:#052016;border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{background:linear-gradient(145deg,var(--panel),#0b1728);border:1px solid var(--line);border-radius:13px;padding:17px}.stat b{font-size:24px;display:block}.stat small{color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0}.toolbar select,.toolbar input{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:rgba(14,26,43,.88);border:1px solid var(--line);border-radius:14px;padding:18px}.league{font-size:11px;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:1px}.time{color:var(--muted);font-size:12px;margin-top:4px}.teams{display:grid;grid-template-columns:1fr 44px 1fr;gap:8px;align-items:center;margin:18px 0}.team{font-size:17px;font-weight:750}.away{text-align:right}.vs{text-align:center;color:var(--muted);font-size:11px}.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.odd{background:var(--panel2);border-radius:8px;padding:9px}.odd small{display:block;color:var(--muted);font-size:10px}.odd b{font-size:16px}.foot{margin-top:12px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;align-items:center}.empty,.error{padding:40px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted);grid-column:1/-1}.error{color:var(--danger)}
.predictBtn{background:var(--panel2);color:var(--accent);border:1px solid var(--accent);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer}.predictBtn:disabled{opacity:.5;cursor:default}
.predictBox{margin-top:12px;padding:12px;background:var(--panel2);border-radius:10px;border:1px solid var(--line);font-size:12px}
.predictBox .row{display:flex;justify-content:space-between;margin:3px 0}.predictBox .pct{font-weight:800}
.valueTag{display:inline-block;margin-top:8px;padding:4px 8px;background:rgba(84,214,162,.15);color:var(--accent);border:1px solid var(--accent);border-radius:6px;font-weight:800;font-size:11px}
.predictErr{color:var(--danger);font-size:11px}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero{display:block}.actions{margin-top:15px}}
</style>
</head>
<body>
<header><div class="logo">Football <span>Predictor</span> <small style="color:#7086a2">V2.7</small></div><div class="status"><i id="dot" class="dot"></i><span id="status">Connecting…</span></div></header>
<main>
<section class="hero"><div><div class="eyebrow">Live data edition</div><h1>Upcoming football markets</h1><p>Real fixtures and bookmaker odds from The Odds API. No demo matches and no synthetic odds.</p></div><div class="actions"><button class="btn" onclick="loadMatches()">Refresh data</button></div></section>
<section class="stats">
<div class="stat"><b id="count">—</b><small>real upcoming matches</small></div>
<div class="stat"><b id="books">—</b><small>bookmaker feeds</small></div>
<div class="stat"><b id="leagues">—</b><small>competitions</small></div>
<div class="stat"><b id="updated">—</b><small>last update</small></div>
</section>
<div class="toolbar"><input id="search" placeholder="Search team or league…" oninput="render()"><select id="league" onchange="render()"><option value="">All competitions</option></select></div>
<section id="matches" class="grid"><div class="empty">Loading real fixtures…</div></section>
</main>
<script>
let data=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(t){return new Intl.DateTimeFormat(undefined,{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(t))}
function best(m,name){const x=(m.bestH2H||[]).find(o=>o.name===name);return x?x.price:null}
function render(){
 const q=document.getElementById('search').value.toLowerCase(), l=document.getElementById('league').value;
 const rows=data.filter(m=>(!l||m.league===l)&&(!q||(`${m.homeTeam} ${m.awayTeam} ${m.league}`).toLowerCase().includes(q)));
 const box=document.getElementById('matches');
 if(!rows.length){box.innerHTML='<div class="empty">No real fixtures available for the selected filter.</div>';return}
 box.innerHTML=rows.map(m=>`<article class="card">
 <div class="league">${esc(m.league)}</div><div class="time">${fmt(m.commenceTime)}</div>
 <div class="teams"><div class="team">${esc(m.homeTeam)}</div><div class="vs">VS</div><div class="team away">${esc(m.awayTeam)}</div></div>
 <div class="odds">${[m.homeTeam,'Draw',m.awayTeam].map(n=>`<div class="odd"><small>${esc(n)}</small><b>${best(m,n)?best(m,n).toFixed(2):'—'}</b></div>`).join('')}</div>
 <div class="foot"><span>${m.bookmakersCount} bookmakers</span><button class="predictBtn" data-id="${esc(m.id)}" onclick="predictMatch(this,'${esc(m.homeTeam).replace(/'/g,"\\'")}','${esc(m.awayTeam).replace(/'/g,"\\'")}',${best(m,m.homeTeam)||0},${best(m,'Draw')||0},${best(m,m.awayTeam)||0})">Predict</button></div>
 <div class="predictBox" id="predict-${esc(m.id)}" style="display:none"></div>
 </article>`).join('');
}
async function loadMatches(){
 document.getElementById('status').textContent='Fetching live data…';document.getElementById('dot').className='dot';
 document.getElementById('matches').innerHTML='<div class="empty">Requesting real fixtures from The Odds API…</div>';
 try{
  const r=await fetch('/api/matches?days=3&markets=h2h&regions=eu'); const j=await r.json();
  if(!r.ok||!j.ok) throw new Error(j.error||'API request failed');
  data=j.matches||[]; document.getElementById('count').textContent=data.length;
  document.getElementById('books').textContent=data.reduce((s,m)=>s+m.bookmakersCount,0);
  document.getElementById('leagues').textContent=new Set(data.map(m=>m.league)).size;
  document.getElementById('updated').textContent=new Date(j.fetchedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  const sel=document.getElementById('league'); const old=sel.value; sel.innerHTML='<option value="">All competitions</option>'+[...new Set(data.map(m=>m.league))].sort().map(x=>`<option>${esc(x)}</option>`).join('');sel.value=old;
  document.getElementById('status').textContent='Live data connected';document.getElementById('dot').className='dot ok';render();
 }catch(e){document.getElementById('status').textContent='Data unavailable';document.getElementById('dot').className='dot';document.getElementById('matches').innerHTML=`<div class="error">${esc(e.message)}</div>`}
}
loadMatches();

async function predictMatch(btn, home, away, homeOdds, drawOdds, awayOdds){
 btn.disabled=true; btn.textContent='Loading…';
 const id=btn.getAttribute('data-id');
 const box=document.getElementById('predict-'+id);
 box.style.display='block'; box.innerHTML='Analyzing form and head-to-head…';
 try{
  const url=`/api/predict?home=${encodeURIComponent(home)}&away=${encodeURIComponent(away)}&homeOdds=${homeOdds}&drawOdds=${drawOdds}&awayOdds=${awayOdds}`;
  const r=await fetch(url); const j=await r.json();
  if(!r.ok||!j.ok) throw new Error(j.error||'Prediction failed');
  const pct=x=>(x*100).toFixed(0)+'%';
  let html=`<div class="row"><span>${esc(home)}</span><span class="pct">${pct(j.model.home)}</span></div>
   <div class="row"><span>Draw</span><span class="pct">${pct(j.model.draw)}</span></div>
   <div class="row"><span>${esc(away)}</span><span class="pct">${pct(j.model.away)}</span></div>`;
  if(j.value){
   const label=j.value.side==='home'?home:(j.value.side==='away'?away:'Draw');
   html+=`<div class="valueTag">Value: ${esc(label)} (+${(j.value.edge*100).toFixed(1)}pp vs market)</div>`;
  }
  box.innerHTML=html;
 }catch(e){
  box.innerHTML=`<div class="predictErr">${esc(e.message)}</div>`;
 }
 btn.disabled=false; btn.textContent='Predict';
}
</script>
</body></html>
